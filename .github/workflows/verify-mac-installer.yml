name: Verify signed Mac installer
run-name: Mac installer ${{ inputs.version }} ${{ inputs.source_sha }}

# A standalone public run: calling this as a reusable private workflow would
# retain private-runner billing. No npm publication or channel promotion.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact already-published signed application version
        required: true
        type: string
      source_sha:
        description: Exact application packaging source SHA from its signed manifest
        required: true
        type: string
      baseline_version:
        description: Exact signed app to leave behind for failed-first-install recovery
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'davidkariuki123/relay-companion' && github.ref == 'refs/heads/main'
    name: ${{ matrix.platform }} ${{ matrix.mode }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64, mode: fresh }
          - { os: macos-15-intel, platform: darwin-x64, mode: fresh }
          - { os: macos-14, platform: darwin-arm64, mode: leftover }
          - { os: macos-15-intel, platform: darwin-x64, mode: leftover }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Verify unmodified signed installer through its UI
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
          INSTALLER_SOURCE_SHA: ${{ inputs.source_sha }}
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          INSTALLER_MODE: ${{ matrix.mode }}
        run: node scripts/verify-mac-installer.mjs
      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-installer-${{ matrix.platform }}-${{ matrix.mode }}
          path: mac-installer-evidence/
          retention-days: 3
          if-no-files-found: warn
